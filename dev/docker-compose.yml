name: mdt-dev

x-wp-env: &wp-env
  WORDPRESS_DB_HOST: db
  WORDPRESS_DB_USER: wp
  WORDPRESS_DB_PASSWORD: wp
  WORDPRESS_DB_NAME: wp
  WORDPRESS_DEBUG: "0"

services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  wordpress:
    image: wordpress:php8.2-apache
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${WP_PORT:-8080}:80"
    environment:
      <<: *wp-env
    volumes:
      - wp_data:/var/www/html
      - ../mim-dollar-toolkit:/var/www/html/wp-content/plugins/mim-dollar-toolkit
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins

  wpcli:
    image: wordpress:cli-php8.2
    user: "33:33"
    depends_on:
      - wordpress
    environment:
      <<: *wp-env
      HOME: /tmp
    volumes:
      - wp_data:/var/www/html
      - ../mim-dollar-toolkit:/var/www/html/wp-content/plugins/mim-dollar-toolkit
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./seed-products.php:/seed-products.php:ro
    entrypoint: ["wp"]
    command: ["--info"]

volumes:
  db_data:
  wp_data:
